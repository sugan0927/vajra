[package]
name = "vajra-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vajra = { path = ".." }

# Keep the fuzz workspace separate from the main crate.
[workspace]

