# Nginx configured as close as possible to bench/vajra-bench.toml:
# same worker count, same document root, same proxy target, access log off.
# Placeholders @ROOT@, @WORKERS@, @TMP@ are filled in by bench/run.sh.
worker_processes @WORKERS@;
worker_cpu_affinity auto;
pid @TMP@/nginx.pid;
error_log @TMP@/nginx-error.log warn;
worker_rlimit_nofile 262144;
events { worker_connections 65536; use epoll; multi_accept on; }

http {
    access_log off;
    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65; keepalive_requests 1000000;
    open_file_cache max=4096 inactive=20s; open_file_cache_valid 2s;
    client_body_temp_path @TMP@/body; proxy_temp_path @TMP@/proxy;
    fastcgi_temp_path @TMP@/fcgi; uwsgi_temp_path @TMP@/uwsgi; scgi_temp_path @TMP@/scgi;

    upstream backend { server 127.0.0.1:9000; keepalive 256; }

    # The upstream used by *both* servers: a trivial static answer from nginx itself.
    server {
        listen 127.0.0.1:9000 reuseport;
        location / { default_type text/plain; return 200 "upstream ok\n"; }
    }

    server {
        listen 127.0.0.1:8081 reuseport;
        root @ROOT@;
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
        }
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
        }
    }
}
